appId: io.github.hansbug.stowly
productName: Stowly
copyright: Copyright (c) 2026 HansBug
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  # scripts/prepare-python.mjs fills resources/python with a relocatable CPython plus the backend and packingsolver3d.
  - from: resources/python
    to: python
    filter: ["**/*", "!**/__pycache__/**"]
asar: true
npmRebuild: false
win:
  target: [{ target: nsis, arch: [x64] }]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [{ target: dmg, arch: [arm64, x64] }]
  category: public.app-category.productivity
linux:
  target: [{ target: AppImage, arch: [x64] }, { target: deb, arch: [x64] }]
  category: Office
  maintainer: HansBug <hansbug@buaa.edu.cn>
deb:
  # Electron's own runtime requirements; electron-builder's default list omits libgbm1 and libasound2, which a minimal
  # Ubuntu 20.04 does not have (found by the Build Desktop container test). libasound2t64 is the 24.04 name.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libdrm2
    - libxkbcommon0
    - libasound2t64 | libasound2
