appId: io.github.hansbug.stowly
productName: Stowly
copyright: Copyright (c) 2026 HansBug
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  # scripts/prepare-python.mjs fills resources/python with a relocatable CPython plus the backend and packingsolver3d.
  - from: resources/python
    to: python
    filter: ["**/*", "!**/__pycache__/**"]
asar: true
npmRebuild: false
# Every platform ships two forms per architecture: a portable archive (extract and run) and an installer, both named
# ${productName}-${version}-<os>-<arch>-{portable|installer}.<ext>. No `arch` is listed here on purpose: an arch list in the
# config wins over the CLI, and each Build Desktop runner must build only its own architecture (`--x64` / `--arm64`)
# because the bundled CPython is architecture-specific. Debian/AppImage spell the arch differently (amd64, x86_64); the
# workflow renames those to x64/arm64 after packaging.
win:
  target: [nsis, zip]
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  artifactName: ${productName}-${version}-win-${arch}-installer.${ext}
mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-mac-${arch}-portable.${ext}
dmg:
  artifactName: ${productName}-${version}-mac-${arch}-installer.${ext}
linux:
  target: [AppImage, deb, tar.gz]
  artifactName: ${productName}-${version}-linux-${arch}-portable.${ext}
  category: Office
  maintainer: HansBug <hansbug@buaa.edu.cn>
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}-installer.${ext}
  # Electron's own runtime requirements; electron-builder's default list omits libgbm1 and libasound2, which a minimal
  # Ubuntu 20.04 does not have (found by the Build Desktop container test). libasound2t64 is the 24.04 name.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libdrm2
    - libxkbcommon0
    - libasound2t64 | libasound2
