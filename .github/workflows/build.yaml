name: Build Desktop

# Packages the app for every platform, then proves each package works where nothing else is installed:
# the Linux .deb is installed into a bare ubuntu:20.04 container (no Python, no Node), the Windows and macOS
# builds run with a PATH that hides the runner's toolchains. `stowly --smoke` is the app's own self-test
# (bundled interpreter, HTTP API, a small solve, the renderer talking to the backend). Artifacts carry the
# installers and the smoke reports; a tag `v*` also publishes them as a GitHub release.

on:
  push:
    branches: ['main', 'ci/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One architecture per runner: the bundled CPython is architecture-specific, so electron-builder must not
          # cross-package the other macOS arch on the same machine.
          - os: ubuntu-22.04
            target: linux-x64
            builder: --linux
            unpacked: dist/linux-unpacked
          - os: windows-2022
            target: win-x64
            builder: --win
            unpacked: dist/win-unpacked
          - os: macos-14
            target: mac-arm64
            builder: --mac --arm64
            unpacked: dist/mac-arm64
          - os: macos-15-intel
            target: mac-x64
            builder: --mac --x64
            unpacked: dist/mac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bundle CPython with the backend
        run: node scripts/prepare-python.mjs --target ${{ matrix.target }}
      - name: Build renderer and main
        run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List artifacts
        shell: bash
        run: ls -la dist | grep -v -E "^d|builder-"

      # --- Prove the package runs without Python or Node on the machine ---
      - name: Smoke test the .deb in a bare Ubuntu 20.04 container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist" -e DEBIAN_FRONTEND=noninteractive ubuntu:20.04 bash -euxo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq /dist/*.deb xvfb > /dev/null
            if command -v python3 || command -v python || command -v node; then echo "a toolchain is present, the environment is not clean"; exit 1; fi
            cd /tmp
            xvfb-run -a /opt/Stowly/stowly --no-sandbox --smoke=/dist/smoke-deb-ubuntu2004.json
            cat /dist/smoke-deb-ubuntu2004.json
          '
      - name: Smoke test the AppImage in a bare Ubuntu 22.04 container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist" -e DEBIAN_FRONTEND=noninteractive ubuntu:22.04 bash -euxo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq xvfb libfuse2 libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libasound2 libgbm1 > /dev/null
            if command -v python3 || command -v python || command -v node; then echo "a toolchain is present, the environment is not clean"; exit 1; fi
            cd /tmp
            xvfb-run -a /dist/*.AppImage --appimage-extract-and-run --no-sandbox --smoke=/dist/smoke-appimage-ubuntu2204.json
            cat /dist/smoke-appimage-ubuntu2204.json
          '
      - name: Smoke test the unpacked build with the toolchains hidden (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "C:\Windows\System32;C:\Windows"
          Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue
          $report = "$PWD\dist\smoke-win-unpacked.json"
          $p = Start-Process -FilePath "$PWD\${{ matrix.unpacked }}\Stowly.exe" -ArgumentList "--smoke=$report" -Wait -PassThru -NoNewWindow
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
      - name: Smoke test the .app with the toolchains hidden (macOS)
        if: runner.os == 'macOS'
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$PWD/${{ matrix.unpacked }}/Stowly.app/Contents/MacOS/Stowly" --smoke="$PWD/dist/smoke-${{ matrix.target }}.json"
          cat "dist/smoke-${{ matrix.target }}.json"
      - name: The smoke reports must name the bundled interpreter
        shell: bash
        run: |
          for f in dist/smoke-*.json; do
            echo "== $f"
            grep -q '"ok": true' "$f"
            grep -E '"python":' "$f" | grep -q -E 'resources|Resources'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: stowly-${{ matrix.target }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/smoke-*.json
          if-no-files-found: error

  release:
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/smoke-*.json
          generate_release_notes: true
