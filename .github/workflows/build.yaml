name: Build Desktop

# Packages the app for six targets (Linux, Windows, macOS; x64 and arm64), each as a portable archive (extract and run)
# and an installer, then proves every package works where nothing else is installed: Linux packages run inside bare
# ubuntu:20.04 / ubuntu:22.04 containers with python and node removed, Windows and macOS packages run with the runner's
# toolchains hidden from PATH. `stowly --smoke` is the app's own self-test (bundled interpreter, HTTP API, a small solve,
# the renderer talking to the backend). Artifacts carry the packages and the smoke reports; a tag `v*` also publishes
# them as a GitHub release.

on:
  push:
    branches: ['main', 'ci/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One architecture per runner, built natively: the bundled CPython is architecture-specific.
          - os: ubuntu-22.04
            target: linux-x64
            builder: --linux --x64
            unpacked: dist/linux-unpacked
          # No AppImage on arm64: electron-builder's arm64 AppImage runtime links an unversioned libz.so that distributions do
          # not ship ("error while loading shared libraries: libz.so"); the portable tar.gz and the .deb cover arm64.
          - os: ubuntu-22.04-arm
            target: linux-arm64
            builder: --linux deb tar.gz --arm64
            unpacked: dist/linux-arm64-unpacked
          - os: windows-2022
            target: win-x64
            builder: --win --x64
            unpacked: dist/win-unpacked
          - os: windows-11-arm
            target: win-arm64
            builder: --win --arm64
            unpacked: dist/win-arm64-unpacked
          - os: macos-14
            target: mac-arm64
            builder: --mac --arm64
            unpacked: dist/mac-arm64
          - os: macos-15-intel
            target: mac-x64
            builder: --mac --x64
            unpacked: dist/mac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bundle CPython with the backend
        run: node scripts/prepare-python.mjs --target ${{ matrix.target }}
      - name: Build renderer and main
        run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Normalise architecture names
        shell: bash
        # electron-builder spells the architecture per format (deb: amd64, AppImage: x86_64); every file uses x64 / arm64.
        run: |
          cd dist
          for f in *amd64* *x86_64*; do
            if [ -e "$f" ]; then mv -v "$f" "$(echo "$f" | sed -e 's/amd64/x64/' -e 's/x86_64/x64/')"; fi
          done
          rm -f latest*.yml
          ls -la | grep -v -E "^d|builder-"

      # --- Linux: installer (.deb) in a bare Ubuntu 20.04; portable tar.gz and AppImage in a bare Ubuntu 22.04 ---
      - name: Smoke test the .deb installer in a bare Ubuntu 20.04 container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist" -e DEBIAN_FRONTEND=noninteractive ubuntu:20.04 bash -euxo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends /dist/*-installer.deb xvfb > /dev/null
            # apt dependencies of the desktop libraries may drag a python3 in; remove every interpreter the app could fall back to,
            # then prove none is left. The app must run on its bundled CPython alone.
            rm -f /usr/bin/python* /usr/local/bin/python* /usr/bin/node /usr/local/bin/node
            if command -v python3 || command -v python || command -v node; then echo "a toolchain is present, the environment is not clean"; exit 1; fi
            cd /tmp
            status=0
            xvfb-run -a /opt/Stowly/stowly --no-sandbox --disable-gpu --disable-dev-shm-usage --smoke=/dist/smoke-${{ matrix.target }}-installer-deb-ubuntu2004.json || status=$?
            cat /dist/smoke-${{ matrix.target }}-installer-deb-ubuntu2004.json || true
            exit $status
          '
      - name: Smoke test the portable tar.gz and the AppImage in a bare Ubuntu 22.04 container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist" -e DEBIAN_FRONTEND=noninteractive -e TARGET=${{ matrix.target }} ubuntu:22.04 bash -euxo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libasound2 libgbm1 > /dev/null
            rm -f /usr/bin/python* /usr/local/bin/python* /usr/bin/node /usr/local/bin/node
            if command -v python3 || command -v python || command -v node; then echo "a toolchain is present, the environment is not clean"; exit 1; fi
            mkdir -p /tmp/portable && tar -xzf /dist/*-portable.tar.gz -C /tmp/portable
            app=$(find /tmp/portable -maxdepth 2 -type f -name stowly | head -1)
            echo "portable binary: $app"
            cd /tmp
            status=0
            xvfb-run -a "$app" --no-sandbox --disable-gpu --disable-dev-shm-usage --smoke=/dist/smoke-$TARGET-portable-targz-ubuntu2204.json || status=$?
            cat /dist/smoke-$TARGET-portable-targz-ubuntu2204.json || true
            [ "$status" = 0 ]
            if ls /dist/*.AppImage > /dev/null 2>&1; then
              xvfb-run -a /dist/*.AppImage --appimage-extract-and-run --no-sandbox --disable-gpu --disable-dev-shm-usage --smoke=/dist/smoke-$TARGET-appimage-ubuntu2204.json || status=$?
              cat /dist/smoke-$TARGET-appimage-ubuntu2204.json || true
            fi
            exit $status
          '

      # --- Diagnostic (Windows arm64 only, never fails the job): the legacy NSIS 3.0.4.1 installer detects ARM64 correctly but its
      #     x86 Nsis7z plugin leaves no files behind under emulation. Try the modern NSIS 3.12 bundle and the zip payload.
      - name: Experiment with alternative NSIS toolsets for the arm64 installer
        if: matrix.target == 'win-arm64'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $variants = @(
            @{ name = "nsis312";      args = @("-c.toolsets.nsis=1.2.1") },
            @{ name = "zip";          args = @("-c.nsis.useZip=true") },
            @{ name = "nsis312-zip";  args = @("-c.toolsets.nsis=1.2.1", "-c.nsis.useZip=true") }
          )
          foreach ($v in $variants) {
            $out = "$PWD\dist-exp-$($v.name)"
            Write-Host "===== variant $($v.name): $($v.args -join ' ')"
            npx electron-builder --win nsis --arm64 --publish never "-c.directories.output=$out" @($v.args) 2>&1 | Select-Object -Last 5
            $setup = Get-ChildItem "$out\*-installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $setup) { Write-Host "no installer produced"; continue }
            $installDir = "$out\installed"
            $i = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
            Start-Sleep -Seconds 20
            Write-Host "installer exit $($i.ExitCode); files in ${installDir}:"
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Out-String | Write-Host
            Get-Content "$installDir\install-debug.txt" -ErrorAction SilentlyContinue | Write-Host
            if (Test-Path "$installDir\Stowly.exe") {
              $env:Path = "C:\Windows\System32;C:\Windows"
              $p = Start-Process -FilePath "$installDir\Stowly.exe" -ArgumentList "--smoke=$out\smoke.json" -Wait -PassThru -NoNewWindow
              Write-Host "smoke exit $($p.ExitCode)"; Get-Content "$out\smoke.json" -ErrorAction SilentlyContinue | Select-Object -First 12 | Write-Host
            }
          }

      # --- Windows: the portable zip extracted next to nothing, and the NSIS installer installed silently; toolchains hidden ---
      - name: Smoke test the portable zip and the installer with the toolchains hidden (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hidden = "C:\Windows\System32;C:\Windows"
          function Invoke-Smoke($exe, $name) {
            $report = "$PWD\dist\smoke-${{ matrix.target }}-$name.json"
            $saved = $env:Path; $env:Path = $hidden
            Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList "--smoke=$report" -Wait -PassThru -NoNewWindow
            $env:Path = $saved
            Get-Content $report
            if ($p.ExitCode -ne 0) { throw "$name smoke test failed with exit code $($p.ExitCode)" }
          }
          # 1. portable zip: extract and run
          $zip = Get-ChildItem dist\*-portable.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dist\portable -Force
          Invoke-Smoke "$PWD\dist\portable\Stowly.exe" "portable-zip"
          # 2. NSIS installer, silent, into a folder of our choosing
          $setup = Get-ChildItem dist\*-installer.exe | Select-Object -First 1
          $installDir = "$PWD\dist\installed"
          $candidates = @("$installDir\Stowly.exe", "$env:LOCALAPPDATA\Programs\Stowly\Stowly.exe", "$env:LOCALAPPDATA\Programs\stowly\Stowly.exe", "$env:ProgramFiles\Stowly\Stowly.exe")
          function Find-Installed { $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          $i = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          Write-Host "installer exit code $($i.ExitCode)"
          for ($t = 0; $t -lt 90 -and -not (Find-Installed); $t++) { Start-Sleep -Seconds 1 }
          if (-not (Find-Installed)) {
            # Second attempt through cmd, which behaves differently for emulated x86 stubs on Windows on ARM.
            Write-Host "nothing installed after Start-Process; retrying through cmd /c start /wait"
            cmd /c "start /wait `"`" `"$($setup.FullName)`" /S /D=$installDir"
            Write-Host "cmd exit code $LASTEXITCODE"
            for ($t = 0; $t -lt 90 -and -not (Find-Installed); $t++) { Start-Sleep -Seconds 1 }
          }
          if (-not (Find-Installed)) {
            Write-Host "--- diagnostics"
            Get-Process | Where-Object { $_.Name -like "*towly*" -or $_.Name -like "*nsis*" } | Select-Object Name, Id, Path | Format-Table | Out-String | Write-Host
            foreach ($dir in @($installDir, "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")) { Write-Host "== $dir"; Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Out-String | Write-Host }
            foreach ($hive in @("HKCU:", "HKLM:")) { Get-ItemProperty "$hive\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*towly*" } | Select-Object DisplayName, InstallLocation, UninstallString | Format-List | Out-String | Write-Host }
            Write-Host "installer: $($setup.FullName) $((Get-Item $setup.FullName).Length) bytes"
            Write-Host "== install-debug.txt"; Get-Content "$installDir\install-debug.txt" -ErrorAction SilentlyContinue | Write-Host
            throw "installed Stowly.exe not found after the silent install"
          }
          $installedExe = Find-Installed
          Write-Host "installed at $installedExe"
          Get-Content (Join-Path (Split-Path $installedExe) "install-debug.txt") -ErrorAction SilentlyContinue | Write-Host
          Stop-Process -Name Stowly -ErrorAction SilentlyContinue   # in case the installer launched the app
          Invoke-Smoke $installedExe "installer-nsis"

      # --- macOS: the portable zip extracted, and the .app straight from the mounted DMG; toolchains hidden ---
      - name: Smoke test the portable zip and the DMG with the toolchains hidden (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist/portable dist/dmg
          ditto -x -k dist/*-portable.zip dist/portable
          hdiutil attach -nobrowse -readonly -mountpoint "$PWD/dist/dmg" dist/*-installer.dmg
          status=0
          for case in "portable-zip:$PWD/dist/portable/Stowly.app" "installer-dmg:$PWD/dist/dmg/Stowly.app"; do
            name=${case%%:*}; app=${case#*:}
            report="$PWD/dist/smoke-${{ matrix.target }}-$name.json"
            env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$app/Contents/MacOS/Stowly" --smoke="$report" || status=$?
            cat "$report" || true
            [ "$status" = 0 ] || break
          done
          hdiutil detach "$PWD/dist/dmg" || true
          exit $status

      - name: Every smoke report must pass and name the bundled interpreter
        shell: bash
        run: |
          ls dist/smoke-*.json
          for f in dist/smoke-*.json; do
            echo "== $f"
            grep -q '"ok": true' "$f"
            grep -E '"python":' "$f" | grep -q -E 'resources|Resources'
          done

      - name: Upload portable packages
        uses: actions/upload-artifact@v4
        with:
          name: stowly-${{ matrix.target }}-portable
          path: dist/*-portable.*
          if-no-files-found: error
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: stowly-${{ matrix.target }}-installer
          path: |
            dist/*-installer.*
            dist/*.AppImage
          if-no-files-found: error
      - name: Upload smoke reports
        uses: actions/upload-artifact@v4
        with:
          name: stowly-${{ matrix.target }}-smoke-reports
          path: dist/smoke-*.json
          if-no-files-found: error

  release:
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*-portable.*
            artifacts/*-installer.*
            artifacts/*.AppImage
            artifacts/smoke-*.json
          generate_release_notes: true
