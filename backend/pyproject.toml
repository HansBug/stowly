[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stowly-backend"
version = "0.1.0"
description = "Local HTTP backend of Stowly: presets, importers and packingsolver3d solves."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "packingsolver3d>=0.0.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["stowly_backend*"]

[tool.setuptools.package-data]
"stowly_backend.presets" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["stowly_backend"]
omit = ["stowly_backend/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
